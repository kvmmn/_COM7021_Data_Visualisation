      <text x="710.0" y="135.0" text-anchor="middle" class="tiny">matplotlib</text><text x="710.0" y="149.0" text-anchor="middle" class="tiny">220 dpi PNG</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="840" y="86" width="140" height="82" rx="12"
            fill="#E6F5F2" stroke="#002B49" stroke-width="1.5"/>
      <text x="910.0" y="119.0" text-anchor="middle" class="lab">Dashboard</text>
      <text x="910.0" y="135.0" text-anchor="middle" class="tiny">multi-filter</text><text x="910.0" y="149.0" text-anchor="middle" class="tiny">decision view</text>
    </g><line x1="184" y1="127" x2="236" y2="127" stroke="#5A6B75" stroke-width="2" marker-end="url(#arrow)"/><line x1="384" y1="127" x2="436" y2="127" stroke="#3AA89A" stroke-width="2" marker-end="url(#arrowT)"/><line x1="584" y1="127" x2="636" y2="127" stroke="#3AA89A" stroke-width="2" marker-end="url(#arrowT)"/><line x1="784" y1="127" x2="836" y2="127" stroke="#3AA89A" stroke-width="2" marker-end="url(#arrowT)"/>
    <rect x="260" y="196" width="130" height="24" rx="12.0" fill="#002B49"/>
    <text x="325.0" y="212.0" text-anchor="middle" class="chip">pandas 3.0</text>
    <rect x="410" y="196" width="160" height="24" rx="12.0" fill="#3AA89A"/>
    <text x="490.0" y="212.0" text-anchor="middle" class="chip">normalised metrics</text>
    <rect x="590" y="196" width="150" height="24" rx="12.0" fill="#1A4A6B"/>
