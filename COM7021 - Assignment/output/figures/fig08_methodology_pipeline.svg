<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="248" viewBox="0 0 1020 248">
  <rect width="1020" height="248" fill="#F7FAFB"/>
  
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="118%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4"
                    flood-color="#002B49" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6B75"/>
    </marker>
    <marker id="arrowT" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3AA89A"/>
    </marker>
    <style>
      .lab { font: 600 14px Aptos, 'Helvetica Neue', sans-serif; fill: #002B49; }
      .labw { font: 600 13px Aptos, 'Helvetica Neue', sans-serif; fill: #FFFFFF; }
      .small { font: 400 11px Aptos, 'Helvetica Neue', sans-serif; fill: #5A6B75; }
      .tiny { font: 400 10px Aptos, 'Helvetica Neue', sans-serif; fill: #5A6B75; }
      .chip { font: 700 10px Aptos, 'Helvetica Neue', sans-serif; fill: #FFFFFF; }
      .zone { font: 700 12px Aptos, 'Helvetica Neue', sans-serif; fill: #002B49; }
      .num { font: 700 12px Aptos, 'Helvetica Neue', sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  
    <circle cx="110" cy="58" r="16" fill="#002B49"/>
    <text x="110" y="63" text-anchor="middle" class="num">01</text>
    <circle cx="310" cy="58" r="16" fill="#002B49"/>
    <text x="310" y="63" text-anchor="middle" class="num">02</text>
    <circle cx="510" cy="58" r="16" fill="#002B49"/>
    <text x="510" y="63" text-anchor="middle" class="num">03</text>
    <circle cx="710" cy="58" r="16" fill="#002B49"/>
    <text x="710" y="63" text-anchor="middle" class="num">04</text>
    <circle cx="910" cy="58" r="16" fill="#002B49"/>
    <text x="910" y="63" text-anchor="middle" class="num">05</text>
    <g filter="url(#shadow)">
      <rect x="40" y="86" width="140" height="82" rx="12"
            fill="#FFFFFF" stroke="#C9D5DD" stroke-width="1.5"/>
      <text x="110.0" y="119.0" text-anchor="middle" class="lab">Ingest xlsx</text>
      <text x="110.0" y="135.0" text-anchor="middle" class="tiny">5,000 rows</text><text x="110.0" y="149.0" text-anchor="middle" class="tiny">18 columns</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="240" y="86" width="140" height="82" rx="12"
            fill="#FFFFFF" stroke="#C9D5DD" stroke-width="1.5"/>
      <text x="310.0" y="119.0" text-anchor="middle" class="lab">Type hygiene</text>
      <text x="310.0" y="135.0" text-anchor="middle" class="tiny">serial Date</text><text x="310.0" y="149.0" text-anchor="middle" class="tiny">ISO 2024–25</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="440" y="86" width="140" height="82" rx="12"
            fill="#E6F5F2" stroke="#66C9BA" stroke-width="2.0"/>
      <text x="510.0" y="119.0" text-anchor="middle" class="lab">Derived ratios</text>
      <text x="510.0" y="135.0" text-anchor="middle" class="tiny">cost recovery</text><text x="510.0" y="149.0" text-anchor="middle" class="tiny">rate / 10k pax</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="640" y="86" width="140" height="82" rx="12"
            fill="#FFFFFF" stroke="#C9D5DD" stroke-width="1.5"/>
