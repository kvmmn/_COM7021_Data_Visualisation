e:italic;">Unit cost &amp; policy loop</text><line x1="560" y1="227" x2="560" y2="270" stroke="#5A6B75" stroke-width="2" marker-end="url(#arrow)"/><line x1="395" y1="345" x2="330" y2="345" stroke="#5A6B75" stroke-width="2" marker-end="url(#arrow)"/><path d="M 315 400 C 350 435, 395 435, 420 410" fill="none" stroke="#3AA89A" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowT)"/><text x="368" y="436" text-anchor="middle" class="tiny" style="font-size:9.5px; font-weight:600; fill:#3AA89A; font-style:italic;">Tutor review &amp; rubric calibration</text>
