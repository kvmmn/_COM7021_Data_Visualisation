[project]
name = "aesth"
version = "0.1.0"
description = "The aesthetics of data. A thin visual language over plotnine, Great Tables, and Shiny."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaveh Momeni" }]
keywords = ["visualisation", "plotnine", "great-tables", "shiny", "design-system"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
charts = ["plotnine>=0.15"]
tables = ["great-tables>=0.17"]
apps = ["shiny>=1.0"]
examples = ["aesth[all]", "pandas>=2.2"]
all = ["aesth[charts,tables,apps]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/docs",
  "/README.md",
  "/LICENSE",
]
