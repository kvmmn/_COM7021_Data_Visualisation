    <g filter="url(#shadow)">
      <rect x="300" y="310" width="180" height="52" rx="12"
            fill="#E6F5F2" stroke="#002B49" stroke-width="1.5"/>
      <text x="390.0" y="328.0" text-anchor="middle" class="lab">API layer</text>
      <text x="390.0" y="344.0" text-anchor="middle" class="tiny">read models</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="530" y="310" width="160" height="52" rx="12"
            fill="#FFFFFF" stroke="#C9D5DD" stroke-width="1.5"/>
      <text x="610.0" y="328.0" text-anchor="middle" class="lab">Export</text>
      <text x="610.0" y="344.0" text-anchor="middle" class="tiny">CSV / Parquet</text>
    </g><line x1="230" y1="96" x2="280" y2="96" stroke="#5A6B75" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="96" x2="490" y2="96" stroke="#5A6B75" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="122" x2="150" y2="190" stroke="#3AA89A" stroke-width="2" marker-end="url(#arrowT)"/><line x1="250" y1="216" x2="300" y2="216" stroke="#3AA89A" stroke-width="2" marker-end="url(#arrowT)"/><line x1="390" y1="242" x2="390" y2="310" stroke="#3AA89A" stroke-width="2" marker-end="url(#arrowT)"/><rect x="40" y="410" width="940" height="44" rx="14" fill="#002B49"/>
    <rect x="70" y="420" width="120" height="24" rx="12.0" fill="#3AA89A"/>
