      <text x="610.0" y="208.0" text-anchor="middle" class="lab">Quality</text>
      <text x="610.0" y="224.0" text-anchor="middle" class="tiny">checks</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="70" y="310" width="180" height="52" rx="12"
